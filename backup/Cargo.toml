[package]
name = "difftastic-core"
description = "A structural diff that understands syntax."
repository = "https://github.com/wilfred/difftastic"
homepage = "http://difftastic.wilfred.me.uk/"
license = "MIT"
version = "0.70.0"
authors = ["Wilfred Hughes <me@wilfred.me.uk>"]
keywords = ["diff", "syntax"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]
edition = "2021"
# Goal: support at least 12 months of Rust versions, and be
# conservative about upgrades to help packagers.
#
# https://releases.rs/ is a useful website to see when different Rust
# versions were released.
#
# For reference, Debian stable is on 1.85 (see
# https://tracker.debian.org/pkg/rustc) but Debian doesn't currently
# package difftastic. Other distros are somewhat newer.
rust-version = "1.85.0"
include = [
        "/build.rs",
        "/src/",
        "/vendored_parsers/highlights/*.scm",
        "/vendored_parsers/*/src/**/*.c",
        "/vendored_parsers/*/src/**/*.h",
        "/vendored_parsers/*/src/**/*.cc",
        "/LICENSE",
        "/README.md",
]

[lib]
name = "difftastic_core"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/difft-{ target }.{ archive-format }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
regex = "1.10.4"
clap = { version = "4.0.0", features = ["cargo", "env", "wrap_help", "string"] }
typed-arena = "2.0.2"
rustc-hash = "2.0.0"
strsim = "0.11.0"
lazy_static = "1.4.0"
libc = "0.2.108"
log = "0.4.14"
pretty_env_logger = "0.5.0"

radix-heap = "0.4.2"
# ignore does not declare a MSRV, but it's part of ripgrep, which has
# a slightly more aggressive MSRV than difftastic. Constrain ignore to
# a known-good max version.
ignore = ">= 0.4, < 0.4.24"
owo-colors = "4.2.3"
wu-diff = "0.1.2"
rayon = "1.7.0"
tree_magic_mini = "3.2.0"

bumpalo = "3.16.0"
unicode-width = "0.1.9"
crossterm = { version = "0.28.0", features = ["windows"] }
glob = "0.3.1"
strum = { version = "0.26", features = ["derive"] }
hashbrown = "0.17.0"
humansize = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
line-numbers = "0.3.0"
smallvec = "1.13.2"
streaming-iterator = "0.1.9"
encoding_rs = "0.8.35"

# tree-sitter itself.
tree-sitter = "0.26.8"
tree-sitter-language = "0.1.7"

# tree-sitter parsers that are available on crates.io.
tree-sitter-ada = { version = "0.1.0", optional = true }
tree-sitter-asm = { version = "0.24.0", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23.1", optional = true }
tree-sitter-clojure-orchard = { version = "0.2.5", optional = true }
tree-sitter-cmake = { version = "0.7.1", optional = true }
tree-sitter-commonlisp = { version = "0.4.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-dart-orchard = { version = "0.3.0", optional = true }
tree-sitter-devicetree = { version = "0.14.1", optional = true }
tree-sitter-elisp = { version = "1.6.1", optional = true }
tree-sitter-elixir = { version = "0.3.4", optional = true }
tree-sitter-elm = { version = "5.8.0", optional = true }
tree-sitter-erlang = { version = "0.16.0", optional = true }
tree-sitter-fish = { version = "3.6.0", optional = true }
tree-sitter-fortran = { version = "0.5.1", optional = true }
tree-sitter-fsharp = { version = "0.3.0", optional = true }
tree-sitter-gleam = { version = "1.0.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-hcl = { version = "1.1.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-java = { version = "0.23.4", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-make = { version = "1.1.1", optional = true }
tree-sitter-newick = { version = "1.1.0", optional = true }
tree-sitter-nix = { version = "0.3.0", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-ocaml = { version = "0.24.0", optional = true }
tree-sitter-pascal = { version = "0.10.0", optional = true }
tree-sitter-php = { version = "0.23.11", optional = true }
tree-sitter-proto = { version = "0.2.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-qmljs = { version = "0.3.0", optional = true }
tree-sitter-r = { version = "1.2.0", optional = true }
tree-sitter-racket = { version = "0.24.7", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust-orchard = { version = "0.16.6", optional = true }
tree-sitter-scala = { version = "0.26.0", optional = true }
tree-sitter-scheme = { version = "0.24.7", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-sfapex = { version = "2.4.0", optional = true }
tree-sitter-solidity = { version = "1.2.13", optional = true }
tree-sitter-swift = { version = "0.7.1", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-verilog = { version = "1.0.3", optional = true }
tree-sitter-vhdl = { version = "1.4.0", optional = true }
tree-sitter-xml = { version = "0.7.0", optional = true }
tree-sitter-yaml = { version = "0.7.0", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
ts-parser-perl = { version = "1.0.1", optional = true }


[target.'cfg(not(any(windows, target_os = "illumos", target_os = "freebsd")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

pretty_assertions = "1.3.0"

[build-dependencies]
# TODO: enable parallel mode, see discussion in
# https://github.com/rust-lang/cc-rs/pull/849
cc = "1.2.48"
rayon = "1.7.0"
version_check = "0.9.4"

[profile.release]
lto = "thin"

[[bin]]
name = "difft"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.deb]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
	"$auto",
	[ "difft.1", "usr/share/man/man1/", "644" ],
	[ "CHANGELOG.md", "usr/share/doc/difftastic/", "644" ],
]

[features]
default = ["common", "cli"]
cli = []
# Core languages and formats - always included
common = [
  "dep:tree-sitter-bash",
  "dep:tree-sitter-c",
  "dep:tree-sitter-c-sharp",
  "dep:tree-sitter-css",
  "dep:tree-sitter-cpp",
  "dep:tree-sitter-go",
  "dep:tree-sitter-html",
  "dep:tree-sitter-java",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-json",
  "dep:tree-sitter-kotlin",
  "dep:tree-sitter-python",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-rust-orchard",
  "dep:tree-sitter-swift",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-php",
  "dep:tree-sitter-lua",
  "dep:ts-parser-perl",
  "dep:tree-sitter-haskell",
  "dep:tree-sitter-scala",
  "dep:tree-sitter-zig",
  "dep:tree-sitter-toml-ng",
  "dep:tree-sitter-yaml",
  "dep:tree-sitter-xml",
  "dep:tree-sitter-hcl",
  "dep:tree-sitter-cmake",
  "dep:tree-sitter-make",
  "dep:tree-sitter-proto",
  "dep:tree-sitter-latex",
  "dep:tree-sitter-dart-orchard",
  "dep:tree-sitter-fish",
]
# All parsers
full = [
  "common",
  "dep:tree-sitter-ada",
  "dep:tree-sitter-asm",
  "dep:tree-sitter-clojure-orchard",
  "dep:tree-sitter-commonlisp",
  "dep:tree-sitter-devicetree",
  "dep:tree-sitter-elisp",
  "dep:tree-sitter-elixir",
  "dep:tree-sitter-elm",
  "dep:tree-sitter-erlang",
  "dep:tree-sitter-fortran",
  "dep:tree-sitter-fsharp",
  "dep:tree-sitter-gleam",
  "dep:tree-sitter-julia",
  "dep:tree-sitter-newick",
  "dep:tree-sitter-nix",
  "dep:tree-sitter-objc",
  "dep:tree-sitter-ocaml",
  "dep:tree-sitter-pascal",
  "dep:tree-sitter-qmljs",
  "dep:tree-sitter-r",
  "dep:tree-sitter-racket",
  "dep:tree-sitter-scheme",
  "dep:tree-sitter-sequel",
  "dep:tree-sitter-sfapex",
  "dep:tree-sitter-solidity",
  "dep:tree-sitter-verilog",
  "dep:tree-sitter-vhdl",
]
